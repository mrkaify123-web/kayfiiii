<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Free Fire Hosting Manager</title>
    <meta name="description" content="Personal Free Fire hosting management dashboard with match scheduling, 4-series hourly generation, live countdown, earnings tracking, and iPhone-style glass navigation." />
    <meta property="og:title" content="Free Fire Hosting Manager" />
    <meta property="og:description" content="Personal Free Fire hosting management dashboard with match scheduling, 4-series hourly generation, live countdown, earnings tracking, and iPhone-style glass navigation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ff_hosting_settings_v2');
          var isDark = true;
          var pastelBg = '#f2fbf9';
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.appearance) {
              if (parsed.appearance.mode) {
                isDark = parsed.appearance.mode === 'dark';
              }
              if (parsed.appearance.pastelBackground) {
                pastelBg = parsed.appearance.pastelBackground;
              }
            }
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#0b0f19';
            root.style.color = '#f8fafc';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.backgroundColor = pastelBg;
            root.style.setProperty('--background', pastelBg);
            root.style.setProperty('--app-background', pastelBg);
            root.style.color = '#0f172a';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-teal-500/20 selection:text-teal-700 dark:selection:text-teal-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
